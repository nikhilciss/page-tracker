<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Session details · Page Tracker</title>
    <link rel="stylesheet" href="/account.css" />
    <script type="module" src="/session.js"></script>
  </head>
  <body>
    <header>
      <a href="/">← All sessions</a>
      <div class="actions">
        <span id="account"></span><button id="logout" class="secondary">Log out</button>
      </div>
    </header>
    <main>
      <span class="eyebrow">SESSION EXPLORER</span>
      <h1>Session details</h1>
      <p>Replay the experience and explore the context behind each interaction.</p>
      <p id="feedback" role="status"></p>
      <section class="card">
        <h2>Recording information</h2>
        <dl id="details"></dl>
      </section>
      <section class="card">
        <h2>Session video</h2>
        <p id="video-status" role="status">Checking video…</p>
        <video id="session-video" controls playsinline preload="metadata" hidden></video>
        <div class="actions">
          <a id="download-video" class="button" hidden>Download MP4</a
          ><button id="retry-video" class="secondary" hidden>Retry generation</button>
        </div>
      </section>
    </main>
  </body>
</html>
